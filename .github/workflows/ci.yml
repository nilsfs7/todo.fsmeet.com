name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      TAGS: nilsfs7/fsmeet-todo:dev
      NEXT_PUBLIC_SITE_URL: https://dev.todo.fsmeet.dffb.org
      FSMEET_API_URL: https://api.dev.fsmeet.dffb.org/v1
    steps:
      - name: Set environment by branch
        id: build-args
        run: |
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
              echo "set values for production image"
              echo "TAGS=nilsfs7/fsmeet-todo:latest,nilsfs7/fsmeet-todo:prod" >> "$GITHUB_ENV"
              echo "NEXT_PUBLIC_SITE_URL=https://todo.fsmeet.com" >> "$GITHUB_ENV"
              echo "FSMEET_API_URL=https://api.fsmeet.dffb.org/v1" >> "$GITHUB_ENV"
          fi
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v3
        with:
          push: true
          file: ./Dockerfile
          no-cache: true
          tags: ${{ env.TAGS }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            FSMEET_API_URL=${{ env.FSMEET_API_URL }}
